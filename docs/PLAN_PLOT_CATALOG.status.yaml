# Status of the plot-catalog plan (docs/PLAN_PLOT_CATALOG.md) -- the single source of task state.
# One card per task; field meanings in the plan, section 4. Change a card when you claim, hand in or
# finish a task (section 8.1); check the file against the package with
#   python scripts/check_plan_plot_catalog.py
plan_version: 3
package_version: "0.1.0.dev0 (fig-atlas 50ab6eb on main, checked 2026-10-27)"
baseline:                       # what existed when the plan started (not tasks)
  plot_types: 25                # plot types fa ingest bundle draws, each with an example bundle and a contract
  renderers: 54                 # registered renderer names (two omics recipes share a pack renderer's name), each with a gallery picture
gates:                          # researcher decisions (plan section 11): pending | passed | <date and note>
  G1: "passed 2026-10-27 (scope fixed: strict separation -- the analysis script runs the tests, the package draws and records them; S-01..S-06 dropped, R reference tool no longer needed; PC-17 donut/pie deferred to the Phase 5 recheck)"   # candidate list, priorities, scope
  G3: pending                   # new required dependencies (only when a task needs one)
  G4: pending                   # release 0.2.0 after Phase 2
phase_gates:                    # a phase's cards can start only after these gates have passed
  1: [G1]
  2: [G1]
  3: [G1]
  4: [G1]
  5: [G1]
