# Status of the manuscript-drafting plan (plans/PLAN_MANUSCRIPT_DRAFTING.md) -- the single source of task state.
# One card per task. Change a card when you claim, hand in or finish a task.
# status: todo | in_progress | in_review | done | dropped | blocked
# Pilot cards (P-*) run in the private study repository: record commits there as "pilot <sha>",
# and keep study details out of this file (plan G6).
plan_version: 1
gates:                          # researcher decisions (plan section 5): pending | passed <date and note>
  M1: "passed 2026-11-01 (folder docs/manuscripts/<topic>/ in the pilot repository; outline template as in the plan, section 2; journal decided by the author: Nature Communications)"   # pilot conventions
  M2: pending                   # which tools Phase 3 builds (from the friction log and the baseline)
  M3: pending                   # what moves into fig-atlas; public-content scan passed
  M4: pending                   # method paper: result or future work
phase_gates:                    # a phase's cards can start only after these gates have passed
  1: [M1]
  2: [M1]
  3: [M2]
  4: [M3]
  5: [M3]
