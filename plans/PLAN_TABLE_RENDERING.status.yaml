    notes: >-
      G2 passed 2026-11-03: table pages go after the figure pages. Author decision the same
      day: one page per table, a table longer than a page shows the rows that fit and names
      the rest under it (replaced a first version that split tables over pages and listed long
      ones on a CSV-only page). compile_storyline_pdf.py: TABLE_PAGE defaults;
      rows_that_fit measures by drawing, binary search over at most probe_rows_max rows (a
      26,330-row table is never drawn whole); the note under a cut table gives shown / total,
      the order and that the rest are in the CSV; storyline.yaml `render.sort_by` /
      `sort_ascending` choose which rows come first; landscape_min_columns or more columns ->
      drawn turned 90 deg on the portrait page (pages stay A4 portrait); _auto_formats:
      whole-number floats without decimals, columns into the thousands ",.1f", the rest ".4g".
      Per-table `render:` block (renderer params + orientation, transpose, sort_by). Renderer fixes found on real
      tables: column widths now give each column at least its longest word (was: long text
      columns squeezed short ones, which overran their neighbours); a word wider than its
      column is broken between characters; a cell cut at max_lines ends in truncation_mark
      (was: cut silently). tests/test_compendium_tables.py (8). Full suite 1146 passed / 2
      skipped. Checked on a real compendium (29 pages, 9 table pages): rotated pages' text all
      inside the content box; compile about 1 min. Merged to main in PR #43 on 2026-11-03.
      Second pass after the author looked at a rotated 17-column page: at that width even the
      longest word of every column does not fit, so widths fell to the shrink-alike branch and
      broke words between characters -- unreadable, and no font size fixes it. The row policy
      now also applies to columns: a study names the columns a reader reads off paper in
      `render.columns` and the machine-readable rest stay in the CSV, with a note under the
      table giving shown / total columns (shown_columns_note); a short, wide table instead sets
      `render.transpose`. Two renderer defects the same page showed: the title was drawn as one
      unwrapped line and ran off the page (footnotes too) -- both now wrap to the table width
      and are never cut; and an integer coordinate printed as 7301884 beside the same table's
      chr1:24,905,310, so _auto_formats groups integers from five figures up. Tests: title
      wrapping (test_table.py), integer grouping (test_compendium_tables.py). On the real
      compendium all nine table pages are now portrait -- none rotated -- and the shallower
      rows fit more of the long tables. Full suite passes; reference clean.
