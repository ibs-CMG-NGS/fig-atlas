name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    # Tests and the example build on every OS fig-atlas supports; the repository-wide
    # checks (docs site, reference pages, baselines) run once, on Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # Reproducible PDF/SVG timestamps (same convention as .vscode/build_task.ps1).
      SOURCE_DATE_EPOCH: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          unset SOURCE_DATE_EPOCH   # pip zips wheels; ZIP cannot hold dates before 1980 (fails on Windows)
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
          pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.5,<10" "mkdocs-static-i18n>=1.2,<2"

      - name: Unit + renderer snapshot tests
        run: pytest

      - name: Documentation site builds with no broken links (mkdocs.yml)
        if: runner.os == 'Linux'
        run: mkdocs build --strict

      - name: fa CLI is installed and finds the projects
        run: |
          fa --help
          fa list

      - name: "Reference pages are up to date (docs/reference: commands, config keys, gallery)"
        if: runner.os == 'Linux'
        run: fa reference --check

      - name: Renderer inventory is up to date
        if: runner.os == 'Linux'
        run: fa inventory --check

      - name: No new hand-typed numbers in figure legends (docs/baselines/hand_typed_numbers.csv)
        if: runner.os == 'Linux'
        run: fa claims --check

      - name: No new literal style values in renderers / analysis scripts (docs/baselines/hardcoded_literals.csv)
        if: runner.os == 'Linux'
        run: fa lint --hardcoded --check

      - name: Example project builds (no raw data needed)
        env:
          CONFIG_PATH: configs/config.yaml
        run: |
          python analysis/example_analysis.py
          python -m fig_atlas.tools.build_atlas
          python -m fig_atlas.tools.verify_atlas
